# Manual debug upgrade drill: public 0.1.5 source -> exported 0.2.0 source (r267).
# Both versions are rebuilt as DEBUG binaries with release identity. The helper uses a
# throwaway key, marked private HOME and drill service names (systemd user units on Linux;
# scheduled task/supervisor and temporary HKCU environment changes on Windows).
# The target manifest uses committed release metadata, including asks format v2 one-way
# migration and declared capability removals. The workflow explicitly confirms the target
# release. A separate synthetic release has no new migrations and tests rollback TO 0.2.0;
# there is no automatic rollback across the 0.1.5 -> 0.2.0 one-way boundary.
# Component builders use Node >=24.9 and the public three-argument build.sh contract.
# new_native defaults to this set's native; use stub to exercise staging in isolation or a published
# cute-codex-v<version> tag for its archive. Natives are hashed/selected, never executed.
# The public 0.1.5 assets are independently signature-verified before the debug drill.
# Debug mode is NOT formal signed-binary upgrade acceptance: public builds ignore the debug key,
# HOME and service-name overrides. formal-assets uses a fresh hosted runner with embedded release trust;
# see upgrade-e2e.py signed-asset-preflight --help. Signed 0.2.0 artifacts/channel only exist
# after the public signing workflow. Nothing is published and no signing secret is used.
# formal-assets mode uses original release binaries and retained official dry-run signatures.
# It runs only on a fresh hosted runner; no signing key or test-key override is used.
name: Upgrade e2e

on:
  workflow_dispatch:
    inputs:
      mode:
        description: "debug rebuild drill or real signed managed upgrade on a fresh hosted runner"
        required: false
        default: debug
        type: choice
        options: [debug, formal-assets]
      build_run:
        description: "Successful Build binaries run for formal-assets mode"
        required: false
        default: ""
        type: string
      sign_run:
        description: "Successful Sign release dry run retaining formal signatures"
        required: false
        default: ""
        type: string
      from_repo:
        description: "Repository of the installed release's source"
        required: false
        default: senxiu-official/cutex
        type: string
      from_ref:
        description: "Tag / commit of the installed release (0.1.5 = tag cutex-0.1.5 of senxiu-official/cutex)"
        required: false
        default: cutex-0.1.5
        type: string
      from_release:
        description: "Release label of the installed build"
        required: false
        default: "0.1.5"
        type: string
      to_ref:
        description: "Ref of the new release in this repository (empty = the dispatched ref)"
        required: false
        default: ""
        type: string
      to_release:
        description: "Release label of the new build"
        required: false
        default: "0.2.0"
        type: string
      new_native_version:
        description: "Native BUILD-INFO/archive version, independent of the release tag (r58 embeds 0.164.0-r58)"
        required: false
        default: "0.164.0-r58"
        type: string
      new_native:
        description: "Native the new release brings: stub, none, or a published cute-codex release tag (cute-codex-v<version> of senxiu-official/cute-codex)"
        required: false
        default: cute-codex-v0.164.0-r58
        type: string

permissions:
  contents: read

concurrency:
  group: upgrade-e2e-${{ github.ref }}-${{ inputs.mode || 'debug' }}
  cancel-in-progress: true

env:
  PYTHONIOENCODING: utf-8

jobs:
  upgrade:
    if: inputs.mode != 'formal-assets'
    name: upgrade ${{ matrix.platform }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 180
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux-x64
            runner: ubuntu-22.04
            leak_policy: fail
          - platform: windows-x64
            runner: windows-2022
            leak_policy: warn
    defaults:
      run:
        shell: bash
    steps:
      - name: Keep LF line endings (embedded schemas are hashed byte for byte)
        run: git config --global core.autocrlf false
      - name: Helpers of this workflow's ref
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          path: ci
          sparse-checkout: .github
          persist-credentials: false
      - name: New release source (to_ref)
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          path: to
          ref: ${{ inputs.to_ref }}
          persist-credentials: false
      - name: Installed release source (from_ref)
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          path: from
          repository: ${{ inputs.from_repo }}
          ref: ${{ inputs.from_ref }}
          persist-credentials: false
      - name: Release labels and commits
        env:
          FROM_RELEASE: ${{ inputs.from_release }}
          TO_RELEASE: ${{ inputs.to_release }}
        run: |
          set -euo pipefail
          for label in "$FROM_RELEASE" "$TO_RELEASE"; do
            [[ "$label" =~ ^[A-Za-z0-9._-]{1,64}$ ]] || { echo "::error::invalid release label '$label'"; exit 1; }
          done
          [ "$FROM_RELEASE" != "$TO_RELEASE" ] || { echo "::error::from_release and to_release are the same"; exit 1; }
          {
            echo "FROM_RELEASE=$FROM_RELEASE"
            echo "TO_RELEASE=$TO_RELEASE"
            echo "FROM_COMMIT=$(git -C from rev-parse HEAD)"
            echo "TO_COMMIT=$(git -C to rev-parse HEAD)"
          } >> "$GITHUB_ENV"
          echo "from $FROM_RELEASE $(git -C from rev-parse HEAD); to $TO_RELEASE $(git -C to rev-parse HEAD)"
      - name: Pythons from the runner's tool cache
        run: bash ci/.github/ci/component-e2e-pythons.sh
      - name: Node 24 (component builders require at least 24.9)
        uses: actions/setup-node@53b83947a5a98c8d113130e565377fae1a50d02f # v6.3.0
        with:
          node-version: '24.21.0'
      - name: Signing helper dependency
        run: '"$E2E_PYTHON" -m pip install --disable-pip-version-check --no-input "cryptography==46.0.5"'
      - name: Actual installed public assets (signature preflight only)
        env:
          FROM_REPO: ${{ inputs.from_repo }}
          PLATFORM: ${{ matrix.platform }}
        run: |
          set -euo pipefail
          [[ "$FROM_REPO" =~ ^[A-Za-z0-9_.-]+/[A-Za-z0-9_.-]+$ ]] || { echo "::error::invalid from_repo"; exit 1; }
          d="$RUNNER_TEMP/public-from"
          if [ "$RUNNER_OS" = Windows ]; then d="$(cygpath -u "$RUNNER_TEMP")/public-from"; fi
          mkdir -p "$d"
          base="https://github.com/$FROM_REPO/releases/download/cutex-$FROM_RELEASE"
          for name in manifest.json capabilities.json "cutex-$FROM_RELEASE-$PLATFORM.tar.gz"; do
            curl -fsSL --retry 3 -o "$d/$name" "$base/$name"
            curl -fsSL --retry 3 -o "$d/$name.minisig" "$base/$name.minisig"
          done
          # The human/source release carries the signed combined sums.
          base="https://github.com/$FROM_REPO/releases/download/v$FROM_RELEASE"
          curl -fsSL --retry 3 -o "$d/SHA256SUMS" "$base/SHA256SUMS"
          curl -fsSL --retry 3 -o "$d/SHA256SUMS.minisig" "$base/SHA256SUMS.minisig"
          if [ "$RUNNER_OS" = Windows ]; then d="$(cygpath -w "$d")"; fi
          "$E2E_PYTHON" ci/.github/ci/upgrade-e2e.py signed-asset-preflight \
            --assets "$d" --public-key ci/.github/ci/cutex-release.pub \
            --release "$FROM_RELEASE" --platform "$PLATFORM"
      - name: Rust 1.95.0
        run: rustup toolchain install 1.95.0 --profile minimal && rustc +1.95.0 --version
      - name: Build debug cutex of both releases (release identity baked in)
        run: |
          set -euo pipefail
          # One target dir: the dependencies are built once. No debug info keeps both builds small.
          export CARGO_TARGET_DIR="$RUNNER_TEMP/target" CARGO_PROFILE_DEV_DEBUG=0 CUTEX_CHANNEL=release
          if [ "$RUNNER_OS" = Windows ]; then exe=.exe; tmp="$(cygpath -u "$RUNNER_TEMP")"; else exe=; tmp="$RUNNER_TEMP"; fi
          for side in from to; do
            if [ "$side" = from ]; then label="$FROM_RELEASE"; else label="$TO_RELEASE"; fi
            (
              cd "$side"
              export CUTEX_RELEASE="$label" CUTEX_COMMIT="$(git rev-parse HEAD)" CUTEX_BUILD_TIME="$(git log -1 --format=%cI)"
              cargo +1.95.0 build --locked --bin cutex --bin cutex-mcp
            )
            mkdir -p "$tmp/bins/$side"
            cp "$tmp/target/debug/cutex$exe" "$tmp/target/debug/cutex-mcp$exe" "$tmp/bins/$side/"
            "$tmp/bins/$side/cutex$exe" --version
          done
          rm -rf "$tmp/target/debug/incremental"
      - name: Neutral build directory for the component builds
        run: |
          if [ "$RUNNER_OS" = Windows ]; then d=/c/build; mkdir -p "$d"; else d=/build; sudo mkdir -p "$d"; sudo chown "$(id -u):$(id -g)" "$d"; fi
          echo "BUILD_ROOT=$d" >> "$GITHUB_ENV"
      - name: Build the new release's component archives
        env:
          LEAK_POLICY: ${{ matrix.leak_policy }}
          PLATFORM: ${{ matrix.platform }}
        run: |
          set -euo pipefail
          components="$("$E2E_PYTHON" ci/.github/ci/components.py matrix --root to)"
          printf '%s\n' "$components" | "$E2E_PYTHON" -c 'import json,sys; rows=json.load(sys.stdin)["include"]; [print(r["name"],r["version"]) for r in rows if r["platform"]==sys.argv[1]]' "$PLATFORM" | tr -d '\r' > "$RUNNER_TEMP/component-rows"
          while read -r name version; do
            echo "== $name $version"
            PYTHON="$E2E_PYTHON" bash "to/components/$name/build.sh" "$PLATFORM" "$version" "$RUNNER_TEMP/archives"
            if [ "$PLATFORM" = linux-x64 ] && [ "$name" = claude-runtime ] && [ "$version" = claude-r32 ]; then
              "$E2E_PYTHON" ci/.github/ci/claude-r32-compat.py "$RUNNER_TEMP/archives" --source-commit "$(git -C to rev-parse HEAD)"
            fi
          done < "$RUNNER_TEMP/component-rows"
          if [ "$RUNNER_OS" = Windows ]; then ls -la "$(cygpath -u "$RUNNER_TEMP")/archives"; else ls -la "$RUNNER_TEMP/archives"; fi
      - name: New native of the new release
        env:
          NEW_NATIVE: ${{ inputs.new_native }}
          NATIVE_VERSION: ${{ inputs.new_native_version }}
          NATIVE_REPO: senxiu-official/cute-codex
          PLATFORM: ${{ matrix.platform }}
        run: |
          set -euo pipefail
          case "$NEW_NATIVE" in
            stub | none) arg="$NEW_NATIVE" ;;
            cute-codex-v*)
              [[ "$NEW_NATIVE" =~ ^cute-codex-v[0-9][A-Za-z0-9._-]{0,63}$ ]] || { echo "::error::invalid cute-codex tag '$NEW_NATIVE'"; exit 1; }
              [[ "$NATIVE_VERSION" =~ ^[0-9][A-Za-z0-9._-]{0,63}$ ]] || { echo "::error::invalid native archive version"; exit 1; }
              version="$NATIVE_VERSION"
              name="native-$version-$PLATFORM.tar.gz"
              d="$RUNNER_TEMP/new-native"
              if [ "$RUNNER_OS" = Windows ]; then d="$(cygpath -u "$RUNNER_TEMP")/new-native"; fi
              mkdir -p "$d"
              base="https://github.com/$NATIVE_REPO/releases/download/$NEW_NATIVE"
              for file in "$name" "$name.minisig" SHA256SUMS SHA256SUMS.minisig; do
                curl -fsSL --retry 3 -o "$d/$file" "$base/$file"
              done
              arg="$d"
              if [ "$RUNNER_OS" = Windows ]; then arg="$(cygpath -w "$d")"; fi
              "$E2E_PYTHON" ci/.github/ci/upgrade-e2e.py signed-native-preflight \
                --assets "$arg" --public-key ci/.github/ci/cutex-release.pub \
                --tag "$NEW_NATIVE" --version "$NATIVE_VERSION" --platform "$PLATFORM"
              ;;
            *) echo "::error::new_native must be stub, none or cute-codex-v<version> (got '$NEW_NATIVE')"; exit 1 ;;
          esac
          echo "NEW_NATIVE_ARG=$arg" >> "$GITHUB_ENV"
      - name: systemd user manager (linger)
        if: runner.os == 'Linux'
        run: |
          set -euo pipefail
          sudo loginctl enable-linger "$(id -un)"
          uid="$(id -u)"
          for _ in $(seq 60); do [ -S "/run/user/$uid/bus" ] && break; sleep 1; done
          [ -S "/run/user/$uid/bus" ] || { echo "::error::no user bus at /run/user/$uid/bus"; exit 1; }
          {
            echo "XDG_RUNTIME_DIR=/run/user/$uid"
            echo "DBUS_SESSION_BUS_ADDRESS=unix:path=/run/user/$uid/bus"
          } >> "$GITHUB_ENV"
          XDG_RUNTIME_DIR="/run/user/$uid" systemctl --user is-system-running || true
      - name: Upgrade e2e
        run: |
          set -euo pipefail
          if [ "$RUNNER_OS" = Windows ]; then
            # Under the user profile (cutex keeps owner-private ACLs), with a space in the path.
            work="$USERPROFILE\\cutex upgrade e2e"
            bins="$(cygpath -w "$RUNNER_TEMP/bins")"
            archives="$(cygpath -w "$RUNNER_TEMP/archives")"
            sep='\'
          else
            work="$RUNNER_TEMP/cutex upgrade e2e"
            bins="$RUNNER_TEMP/bins"
            archives="$RUNNER_TEMP/archives"
            sep=/
          fi
          echo "E2E_WORK=$work" >> "$GITHUB_ENV"
          "$E2E_PYTHON" ci/.github/ci/upgrade-e2e.py \
            --from-cutex "$bins${sep}from" --from-commit "$FROM_COMMIT" \
            --to-cutex "$bins${sep}to" --to-commit "$TO_COMMIT" \
            --components "$archives" --work "$work" --service-name e2e --claude-python "$E2E_PYTHON" \
            --release-meta ci/.github/ci/release-meta --new-native "$NEW_NATIVE_ARG" \
            --confirm-one-way "$TO_RELEASE"
      - name: Unit journal
        if: always() && runner.os == 'Linux'
        run: |
          for unit in cutex-e2e-agent-bus.service cutex-e2e-management-api.service cutex-e2e-job-service.service; do
            journalctl --user --no-pager -o short-iso -u "$unit" -n 100 || true
          done
          journalctl --user --no-pager -o short-iso -u 'cutex-upgrade-*' -n 100 || true
      - name: Collect logs
        if: failure()
        run: |
          tmp="$RUNNER_TEMP"; work="${E2E_WORK:-}"
          if [ "$RUNNER_OS" = Windows ]; then tmp="$(cygpath -u "$tmp")"; [ -z "$work" ] || work="$(cygpath -u "$work")"; fi
          mkdir -p "$tmp/e2e-logs"
          if [ -n "$work" ] && [ -d "$work/logs" ]; then
            cp -R "$work/logs/." "$tmp/e2e-logs/"
          fi
          # The helper never copies config.json / accounts.json and scrubs the tokens; belt and braces.
          find "$tmp/e2e-logs" \( -name config.json -o -name accounts.json -o -name 'auth*.json' \) -delete
      - if: failure()
        uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # v7.0.0
        with:
          name: upgrade-e2e-${{ matrix.platform }}-logs
          path: ${{ runner.temp }}/e2e-logs/
          if-no-files-found: ignore
          retention-days: 7

  formal:
    name: signed managed upgrade ${{ matrix.platform }}
    if: inputs.mode == 'formal-assets'
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    permissions:
      contents: read
      actions: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux-x64
            runner: ubuntu-22.04
          - platform: windows-x64
            runner: windows-2022
    defaults:
      run:
        shell: bash
    steps:
      - name: Require a fresh GitHub-hosted runner
        run: |
          set -euo pipefail
          [ "$GITHUB_ACTIONS" = true ] && [ "$RUNNER_ENVIRONMENT" = github-hosted ] || { echo 'Formal installation requires a disposable GitHub-hosted runner' >&2; exit 1; }
      - name: Keep committed bytes LF
        run: git config --global core.autocrlf false
      - name: Candidate helpers and embedded release public key
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: ${{ inputs.to_ref || github.ref }}
          persist-credentials: false
      - name: Python from the runner's tool cache
        run: bash .github/ci/component-e2e-pythons.sh
      - name: Verification dependency
        run: '"$E2E_PYTHON" -m pip install --disable-pip-version-check --no-input "cryptography==46.0.5"'
      - name: Validate source runs against this candidate
        env:
          GH_TOKEN: ${{ github.token }}
          BUILD_RUN: ${{ inputs.build_run }}
          SIGN_RUN: ${{ inputs.sign_run }}
          CI_WORKFLOW_COMMIT: ${{ github.sha }}
        run: |
          set -euo pipefail
          [[ "$BUILD_RUN" =~ ^[1-9][0-9]*$ && "$SIGN_RUN" =~ ^[1-9][0-9]*$ ]] || { echo 'Successful build_run and sign_run are required' >&2; exit 1; }
          gh api "repos/$GITHUB_REPOSITORY/actions/runs/$BUILD_RUN" > "$RUNNER_TEMP/formal-build-run.json"
          gh api "repos/$GITHUB_REPOSITORY/actions/runs/$SIGN_RUN" > "$RUNNER_TEMP/formal-sign-run.json"
          "$E2E_PYTHON" - <<'PY'
          import json, os, subprocess
          from pathlib import Path
          product_commit = subprocess.check_output(["git", "rev-parse", "HEAD"], text=True).strip()
          ci_commit = os.environ["CI_WORKFLOW_COMMIT"]
          if len(ci_commit) != 40 or any(c not in "0123456789abcdef" for c in ci_commit):
              raise SystemExit("Expected CI workflow commit is not a full SHA")
          print("Reviewed CI workflow:", ci_commit, "Product source:", product_commit)
          root = Path(os.environ["RUNNER_TEMP"])
          for name, path in [("formal-build-run.json", ".github/workflows/build-binaries.yml"),
                             ("formal-sign-run.json", ".github/workflows/sign-release.yml")]:
              run = json.loads((root / name).read_text())
              if (run["status"] != "completed" or run["conclusion"] != "success" or
                      run["head_sha"] != ci_commit or run["path"] != path):
                  raise SystemExit("Workflow run does not match successful candidate build/sign provenance")
          PY
      - name: Original build archives (no rebuild)
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          github-token: ${{ github.token }}
          run-id: ${{ inputs.build_run }}
          path: ${{ runner.temp }}/formal-build
      - name: Formal dry-run documents and detached signatures
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          github-token: ${{ github.token }}
          run-id: ${{ inputs.sign_run }}
          name: sign-release-${{ inputs.sign_run }}
          path: ${{ runner.temp }}/formal-sign
      - name: Validate product BUILD-INFO independently of CI head
        env:
          TO_RELEASE: ${{ inputs.to_release }}
        run: |
          set -euo pipefail
          "$E2E_PYTHON" - <<'PY'
          import json, os, subprocess
          from pathlib import Path
          product_commit = subprocess.check_output(["git", "rev-parse", "HEAD"], text=True).strip()
          root = Path(os.environ["RUNNER_TEMP"]) / "formal-build"
          records = sorted(root.rglob("BUILD-INFO-*.json"))
          if not records:
              raise SystemExit("Missing product BUILD-INFO")
          core_platforms = set()
          for path in records:
              info = json.loads(path.read_text(encoding="utf-8"))
              if info.get("commit") != product_commit:
                  raise SystemExit("BUILD-INFO does not match product source: " + path.name)
              if not path.name.startswith("BUILD-INFO-component-"):
                  if info.get("release") != os.environ["TO_RELEASE"]:
                      raise SystemExit("BUILD-INFO release label mismatch")
                  core_platforms.add(info.get("platform"))
          if core_platforms != {"linux-x64", "windows-x64"}:
              raise SystemExit("Both product platform BUILD-INFO records are required")
          PY
      - name: Original published 0.1.5 and native signed assets
        env:
          FROM_REPO: ${{ inputs.from_repo }}
          FROM_RELEASE: ${{ inputs.from_release }}
          NATIVE_TAG: ${{ inputs.new_native }}
          NATIVE_VERSION: ${{ inputs.new_native_version }}
          PLATFORM: ${{ matrix.platform }}
        run: |
          set -euo pipefail
          [[ "$FROM_REPO" =~ ^[A-Za-z0-9_.-]+/[A-Za-z0-9_.-]+$ ]] || exit 1
          [[ "$FROM_RELEASE" =~ ^[A-Za-z0-9][A-Za-z0-9._-]{0,63}$ ]] || exit 1
          [[ "$NATIVE_TAG" =~ ^cute-codex-v[0-9][A-Za-z0-9._-]{0,63}$ && "$NATIVE_VERSION" =~ ^[0-9][A-Za-z0-9._-]{0,63}$ ]] || exit 1
          tmp="$RUNNER_TEMP"; if [ "$RUNNER_OS" = Windows ]; then tmp="$(cygpath -u "$tmp")"; fi
          mkdir "$tmp/formal-old" "$tmp/formal-native"
          base="https://github.com/$FROM_REPO/releases/download/cutex-$FROM_RELEASE"
          for name in manifest.json capabilities.json "cutex-$FROM_RELEASE-$PLATFORM.tar.gz"; do
            curl -fsSL --retry 3 -o "$tmp/formal-old/$name" "$base/$name"
            curl -fsSL --retry 3 -o "$tmp/formal-old/$name.minisig" "$base/$name.minisig"
          done
          base="https://github.com/$FROM_REPO/releases/download/v$FROM_RELEASE"
          curl -fsSL --retry 3 -o "$tmp/formal-old/SHA256SUMS" "$base/SHA256SUMS"
          curl -fsSL --retry 3 -o "$tmp/formal-old/SHA256SUMS.minisig" "$base/SHA256SUMS.minisig"
          base="https://github.com/senxiu-official/cute-codex/releases/download/$NATIVE_TAG"
          for name in SHA256SUMS "native-$NATIVE_VERSION-$PLATFORM.tar.gz"; do
            curl -fsSL --retry 3 -o "$tmp/formal-native/$name" "$base/$name"
            curl -fsSL --retry 3 -o "$tmp/formal-native/$name.minisig" "$base/$name.minisig"
          done
      - name: Hosted Linux user service manager
        if: runner.os == 'Linux'
        run: |
          set -euo pipefail
          sudo loginctl enable-linger "$(id -un)"
          uid="$(id -u)"
          for _ in $(seq 60); do [ -S "/run/user/$uid/bus" ] && break; sleep 1; done
          [ -S "/run/user/$uid/bus" ]
          echo "XDG_RUNTIME_DIR=/run/user/$uid" >> "$GITHUB_ENV"
          echo "DBUS_SESSION_BUS_ADDRESS=unix:path=/run/user/$uid/bus" >> "$GITHUB_ENV"
      - name: Actual signed managed-install apply and verification
        env:
          FROM_RELEASE: ${{ inputs.from_release }}
          TO_RELEASE: ${{ inputs.to_release }}
          NATIVE_VERSION: ${{ inputs.new_native_version }}
          PLATFORM: ${{ matrix.platform }}
        run: |
          set -euo pipefail
          [ "$FROM_RELEASE" = 0.1.5 ] && [ "$TO_RELEASE" = 0.2.0 ] || { echo 'Formal mode tests only 0.1.5 to 0.2.0' >&2; exit 1; }
          "$E2E_PYTHON" .github/ci/upgrade-e2e.py formal-assets \
            --build-assets "$RUNNER_TEMP/formal-build" --signed-assets "$RUNNER_TEMP/formal-sign" \
            --old-assets "$RUNNER_TEMP/formal-old" --native-assets "$RUNNER_TEMP/formal-native" \
            --public-key .github/ci/cutex-release.pub --expected-commit "$(git rev-parse HEAD)" \
            --expected-native-version "$NATIVE_VERSION" --confirm-one-way "$TO_RELEASE" \
            --management-port 24391 --bus-port 24392 --work "$RUNNER_TEMP/formal upgrade"
      - name: Keep scrubbed verification receipt and logs
        if: always()
        uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # v7.0.0
        with:
          name: formal-upgrade-${{ matrix.platform }}-${{ github.run_id }}
          path: |
            ${{ runner.temp }}/formal upgrade/formal-result.json
            ${{ runner.temp }}/formal upgrade/formal-old-baseline.json
            ${{ runner.temp }}/formal upgrade/logs/
            ${{ runner.temp }}/formal-build-run.json
            ${{ runner.temp }}/formal-sign-run.json
          if-no-files-found: ignore
          retention-days: 14
