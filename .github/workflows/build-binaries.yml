# cutex: build the release archives (cutex + cutex-mcp) for Linux x64 and Windows x64 and keep them as
# workflow artifacts. Nothing is published from here and this build has no signing key. The separate
# Sign release workflow checks and signs these artifacts with the release environment's minisign key,
# then uploads everything to the GitHub Releases that cutex's backend updates read
# (docs/backend-upgrade.md: tag cutex-<release>, channel-release).
#
# Release label: the `release` input, else the tag name without its leading `v` (v0.2.0 -> 0.2.0).
#
# Optional components (components/README.md): every components/<name>/component.json adds one build per
# listed platform (`components/<name>/build.sh <platform> <version> <out>`), uploaded as the artifact
# component-<name>-<platform>. Their files all start with `component-` (archives, SHA256SUMS-component-*,
# BUILD-INFO-component-*), so the cutex-* globs of the release scripts never pick them up. The owner
# publishes each component version once under the tag component-<name>-<version>.
name: Build binaries

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      release:
        description: "Release label baked into the binaries (cutex --version), e.g. 0.1.0; the manifest tag is cutex-<label>"
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: build-binaries-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: cutex ${{ matrix.platform }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        include:
          # 22.04: glibc 2.35, so the binaries also run on older distributions than the newest runner.
          - platform: linux-x64
            runner: ubuntu-22.04
            leak_policy: fail
          - platform: windows-x64
            runner: windows-2022
            leak_policy: warn
    defaults:
      run:
        shell: bash
    steps:
      - name: Keep LF line endings (embedded schemas are hashed byte for byte)
        run: git config --global core.autocrlf false
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - name: Release label
        env:
          INPUT_RELEASE: ${{ inputs.release }}
          REF_TYPE: ${{ github.ref_type }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          label="$INPUT_RELEASE"
          if [ -z "$label" ] && [ "$REF_TYPE" = tag ]; then label="${REF_NAME#v}"; fi
          [[ "$label" =~ ^[A-Za-z0-9._-]{1,64}$ ]] || { echo "::error::no valid release label (got '$label')"; exit 1; }
          echo "RELEASE_LABEL=$label" >> "$GITHUB_ENV"
      - name: Neutral build directory (the binary keeps the source path in one place)
        run: |
          if [ "$RUNNER_OS" = Windows ]; then d=/c/build; mkdir -p "$d"; else d=/build; sudo mkdir -p "$d"; sudo chown "$(id -u):$(id -g)" "$d"; fi
          echo "BUILD_ROOT=$d" >> "$GITHUB_ENV"
      - name: Rust 1.95.0
        run: rustup toolchain install 1.95.0 --profile minimal && rustc +1.95.0 --version
      - name: Build and pack
        env:
          LEAK_POLICY: ${{ matrix.leak_policy }}
        run: bash .github/ci/build-cutex.sh "${{ matrix.platform }}" "$RELEASE_LABEL" "$RUNNER_TEMP/out"
      - uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # v7.0.0
        with:
          name: cutex-${{ matrix.platform }}
          path: ${{ runner.temp }}/out/
          if-no-files-found: error
          retention-days: 30

  component-matrix:
    name: Component matrix
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.m.outputs.matrix }}
      any: ${{ steps.m.outputs.any }}
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - id: m
        name: Read components/*/component.json
        run: |
          set -euo pipefail
          matrix="$(python3 .github/ci/components.py matrix)"
          echo "$matrix"
          echo "matrix=$matrix" >> "$GITHUB_OUTPUT"
          if [ "$(printf '%s' "$matrix" | python3 -c 'import json,sys; print(len(json.load(sys.stdin)["include"]))')" = 0 ]; then
            echo "any=false" >> "$GITHUB_OUTPUT"
          else
            echo "any=true" >> "$GITHUB_OUTPUT"
          fi

  component:
    name: component ${{ matrix.name }} ${{ matrix.platform }}
    needs: component-matrix
    if: needs.component-matrix.outputs.any == 'true'
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.component-matrix.outputs.matrix) }}
    defaults:
      run:
        shell: bash
    steps:
      - name: Keep LF line endings
        run: git config --global core.autocrlf false
      # Full history: job-service's archive mtime is the last commit of its sources (components/
      # job-service/build.sh), so an unchanged component version rebuilds byte for byte in a later release.
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Neutral build directory (the binaries keep the source path in one place)
        run: |
          if [ "$RUNNER_OS" = Windows ]; then d=/c/build; mkdir -p "$d"; else d=/build; sudo mkdir -p "$d"; sudo chown "$(id -u):$(id -g)" "$d"; fi
          echo "BUILD_ROOT=$d" >> "$GITHUB_ENV"
      - name: Rust 1.95.0
        run: rustup toolchain install 1.95.0 --profile minimal && rustc +1.95.0 --version
      - name: Python 3.12 from the runner's tool cache (the system Python 3.10 cannot build the pinned wheels)
        run: bash .github/ci/component-e2e-pythons.sh
      - uses: actions/setup-node@53b83947a5a98c8d113130e565377fae1a50d02f # v6.3.0
        with:
          node-version: "24.21.0"
      - name: Build and pack
        env:
          LEAK_POLICY: ${{ matrix.leak_policy }}
          NAME: ${{ matrix.name }}
          VERSION: ${{ matrix.version }}
          PLATFORM: ${{ matrix.platform }}
        run: PYTHON="$E2E_PYTHON" bash "components/$NAME/build.sh" "$PLATFORM" "$VERSION" "$RUNNER_TEMP/out"
      - name: Check the output
        env:
          NAME: ${{ matrix.name }}
          VERSION: ${{ matrix.version }}
          PLATFORM: ${{ matrix.platform }}
        run: |
          # GitHub's Windows images have `python`, not `python3`.
          if [ "$RUNNER_OS" = Windows ]; then py=python; else py=python3; fi
          "$py" .github/ci/components.py check "$NAME" "$VERSION" "$PLATFORM" "$RUNNER_TEMP/out" --commit "$(git rev-parse HEAD)"
      - name: Compare Claude r32 with the existing immutable runtime bytes
        if: matrix.name == 'claude-runtime' && matrix.version == 'claude-r32'
        env:
          PLATFORM: ${{ matrix.platform }}
        run: |
          set -euo pipefail
          case "$PLATFORM" in
            linux-x64) expected=c210c9fc5a9f87b48b5dd2ec87cb2ac7777863b34288d1febb90ca8246c5dde2 ;;
            windows-x64) expected=a17df7ad4ec6b8d9f0f812380effa2c60c5eaedee0cf8d9967906b400f993112 ;;
            *) exit 1 ;;
          esac
          archive="$RUNNER_TEMP/out/component-claude-runtime-claude-r32-$PLATFORM.tar.gz"
          got="$(sha256sum "$archive" | cut -d' ' -f1)"
          [ "$got" = "$expected" ] || { echo "Claude r32 immutable archive mismatch: $got != $expected" >&2; exit 1; }
      - name: Compare unchanged Job Service with its immutable published archive
        if: matrix.name == 'job-service' && matrix.version == '0.1.1'
        env:
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          sudo apt-get update -q
          sudo apt-get install -y -q minisign
          name=component-job-service-0.1.1-linux-x64.tar.gz
          d="$RUNNER_TEMP/published-job-service"
          mkdir -p "$d"
          base="https://github.com/$REPO/releases/download/component-job-service-0.1.1"
          curl -fsSL --retry 3 -o "$d/$name" "$base/$name"
          curl -fsSL --retry 3 -o "$d/$name.minisig" "$base/$name.minisig"
          minisign -V -p .github/ci/cutex-release.pub -m "$d/$name"
          cmp "$RUNNER_TEMP/out/$name" "$d/$name"
          echo 'Job Service 0.1.1 is byte-identical to its verified published archive'
      - uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # v7.0.0
        with:
          name: component-${{ matrix.name }}-${{ matrix.platform }}
          path: ${{ runner.temp }}/out/
          if-no-files-found: error
          retention-days: 30

  sums:
    name: SHA256SUMS
    needs: [build, component-matrix, component]
    # Runs when the cutex builds passed and the component builds passed or there were none.
    if: >-
      always() && needs.build.result == 'success' && needs.component-matrix.result == 'success' &&
      (needs.component.result == 'success' || (needs.component.result == 'skipped' && needs.component-matrix.outputs.any == 'false'))
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          path: artifacts
          pattern: cutex-*
      - if: needs.component-matrix.outputs.any == 'true'
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          path: artifacts
          pattern: component-*
      - name: Check and combine the per-platform sums
        run: |
          set -euo pipefail
          shopt -s nullglob
          mkdir out
          for d in artifacts/cutex-* artifacts/component-*; do
            (cd "$d" && sha256sum --check SHA256SUMS-*)
            cat "$d"/SHA256SUMS-* >> out/SHA256SUMS
          done
          sort -k2 -o out/SHA256SUMS out/SHA256SUMS
          cat out/SHA256SUMS
          {
            echo '### cutex release archives and component archives'
            echo '```'
            cat out/SHA256SUMS
            echo '```'
            echo 'Unsigned: the owner signs the manifest and archives offline (minisign) before they are attached to a release.'
          } >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # v7.0.0
        with:
          name: SHA256SUMS
          path: out/SHA256SUMS
          if-no-files-found: error
          retention-days: 30
