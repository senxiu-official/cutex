# cutex: build the release archives (cutex + cutex-mcp) for Linux x64 and Windows x64 and keep them as
# workflow artifacts. Nothing is published from here and no signing key is in CI: the owner downloads
# the artifacts (`gh run download`), writes and signs the release manifest offline (minisign) and
# uploads everything to the GitHub Releases that cutex's backend updates read
# (docs/backend-upgrade.md: tag cutex-<release>, channel-release).
#
# Release label: the `release` input, else the tag name without its leading `v` (v0.2.0 -> 0.2.0).
name: Build binaries

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      release:
        description: "Release label baked into the binaries (cutex --version), e.g. 0.1.0; the manifest tag is cutex-<label>"
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: build-binaries-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: cutex ${{ matrix.platform }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        include:
          # 22.04: glibc 2.35, so the binaries also run on older distributions than the newest runner.
          - platform: linux-x64
            runner: ubuntu-22.04
            leak_policy: fail
          - platform: windows-x64
            runner: windows-2022
            leak_policy: warn
    defaults:
      run:
        shell: bash
    steps:
      - name: Keep LF line endings (embedded schemas are hashed byte for byte)
        run: git config --global core.autocrlf false
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - name: Release label
        env:
          INPUT_RELEASE: ${{ inputs.release }}
          REF_TYPE: ${{ github.ref_type }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          label="$INPUT_RELEASE"
          if [ -z "$label" ] && [ "$REF_TYPE" = tag ]; then label="${REF_NAME#v}"; fi
          [[ "$label" =~ ^[A-Za-z0-9._-]{1,64}$ ]] || { echo "::error::no valid release label (got '$label')"; exit 1; }
          echo "RELEASE_LABEL=$label" >> "$GITHUB_ENV"
      - name: Neutral build directory (the binary keeps the source path in one place)
        run: |
          if [ "$RUNNER_OS" = Windows ]; then d=/c/build; mkdir -p "$d"; else d=/build; sudo mkdir -p "$d"; sudo chown "$(id -u):$(id -g)" "$d"; fi
          echo "BUILD_ROOT=$d" >> "$GITHUB_ENV"
      - name: Rust 1.95.0
        run: rustup toolchain install 1.95.0 --profile minimal && rustc +1.95.0 --version
      - name: Build and pack
        env:
          LEAK_POLICY: ${{ matrix.leak_policy }}
        run: bash .github/ci/build-cutex.sh "${{ matrix.platform }}" "$RELEASE_LABEL" "$RUNNER_TEMP/out"
      - uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # v7.0.0
        with:
          name: cutex-${{ matrix.platform }}
          path: ${{ runner.temp }}/out/
          if-no-files-found: error
          retention-days: 30

  sums:
    name: SHA256SUMS
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          path: artifacts
          pattern: cutex-*
      - name: Check and combine the per-platform sums
        run: |
          set -euo pipefail
          mkdir out
          for d in artifacts/cutex-*; do
            (cd "$d" && sha256sum --check SHA256SUMS-*)
            cat "$d"/SHA256SUMS-* >> out/SHA256SUMS
          done
          sort -k2 -o out/SHA256SUMS out/SHA256SUMS
          cat out/SHA256SUMS
          {
            echo '### cutex release archives'
            echo '```'
            cat out/SHA256SUMS
            echo '```'
            echo 'Unsigned: the owner signs the manifest and archives offline (minisign) before they are attached to a release.'
          } >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # v7.0.0
        with:
          name: SHA256SUMS
          path: out/SHA256SUMS
          if-no-files-found: error
          retention-days: 30
