[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "cute-claude-app-server"
version = "0.7.1"
description = "Claude app-server subset with optional official SDK subscription backend"
requires-python = ">=3.11"
license = "MIT"
dependencies = ["httpx>=0.27,<0.29", "websockets>=16,<17", "jsonschema>=4,<5"]

[project.optional-dependencies]
subscription = ["claude-agent-sdk==0.2.166"]
test = ["anyio>=4.0", "pytest>=8,<10", "pytest-asyncio>=0.24,<2", "jsonschema>=4,<5"]

[project.scripts]
cute-claude-app-server = "cute_claude.__main__:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
cute_claude = ["features.json", "model_catalog.json"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
pythonpath = ["src"]
testpaths = ["tests"]
