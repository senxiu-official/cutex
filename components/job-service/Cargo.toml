[package]
name = "cutex-job-service"
version = "0.1.0"
edition = "2024"
license = "MIT"
autobins = false

[features]
test-harness = []

[[bin]]
name = "cutex-job-service"
path = "src/main.rs"

[[bin]]
name = "js1-test-owner"
path = "src/bin/js1-test-owner.rs"
required-features = ["test-harness"]

[dependencies]
hex = "0.4"
hmac = "0.12"
libc = "0.2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
thiserror = "2"
uuid = { version = "1", features = ["v4", "serde"] }
percent-encoding = "2"

[dev-dependencies]
tempfile = "3"
